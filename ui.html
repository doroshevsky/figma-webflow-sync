<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; }
      button { padding: 8px 12px; }
      #status { margin-top: 10px; color: #444; }
    </style>
  </head>
  <body>
    <div style="margin-bottom: 8px;">
      <input id="url" type="text" placeholder="Paste Webflow page URL" style="width: 100%; padding: 6px; box-sizing: border-box;" />
    </div>
    <button id="connect">Connect Webflow</button>
    <button id="sync">Sync from Webflow</button>
    <button id="get-key">Get component key</button>
    <div id="status">Ready.</div>

    <script>
      const statusEl = document.getElementById('status');
      document.getElementById('connect').onclick = () => {
        statusEl.textContent = 'Opening Webflow auth...';
        parent.postMessage({ pluginMessage: { type: 'connect' } }, '*');
      };

      document.getElementById('sync').onclick = () => {
        const url = document.getElementById('url').value.trim();
        statusEl.textContent = 'Syncing...';
        parent.postMessage({ pluginMessage: { type: 'sync', url } }, '*');
      };
      document.getElementById('get-key').onclick = () => {
        statusEl.textContent = 'Select a component or instance...';
        parent.postMessage({ pluginMessage: { type: 'get-key' } }, '*');
      };

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'status') statusEl.textContent = msg.message;
      };
    </script>
  </body>
</html>
