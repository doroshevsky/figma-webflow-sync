<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; }
      button { padding: 8px 12px; }
      #status { margin-top: 10px; color: #444; }
    </style>
  </head>
  <body>
    <div style="margin-bottom: 8px;">
      <input id="url" type="text" placeholder="Paste Webflow page URL" style="width: 100%; padding: 6px; box-sizing: border-box;" />
    </div>
    <button id="connect">Connect Webflow</button>
    <button id="open-auth">Open Auth Link</button>
    <button id="sync">Sync from Webflow</button>
    <button id="get-key">Get component key</button>
    <div id="status">Ready.</div>
    <div id="auth-link" style="margin-top:6px; font-size:11px; color:#666;"></div>
    <div id="auth-link-btn" style="margin-top:6px; display:none;">
      <button id="open-auth-link">Open Auth in Browser</button>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      document.getElementById('connect').onclick = () => {
        statusEl.textContent = 'Opening Webflow auth...';
        parent.postMessage({ pluginMessage: { type: 'connect' } }, '*');
      };
      document.getElementById('open-auth').onclick = () => {
        statusEl.textContent = 'Opening Webflow auth...';
        parent.postMessage({ pluginMessage: { type: 'open-auth' } }, '*');
      };

      document.getElementById('sync').onclick = () => {
        const url = document.getElementById('url').value.trim();
        statusEl.textContent = 'Syncing...';
        parent.postMessage({ pluginMessage: { type: 'sync', url } }, '*');
      };
      document.getElementById('get-key').onclick = () => {
        statusEl.textContent = 'Select a component or instance...';
        parent.postMessage({ pluginMessage: { type: 'get-key' } }, '*');
      };

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'status') statusEl.textContent = msg.message;
        if (msg.type === 'auth-link') {
          const linkEl = document.getElementById('auth-link');
          if (msg.url) {
            linkEl.innerHTML = `Auth link: <a href="${msg.url}" target="_blank" rel="noopener noreferrer">${msg.url}</a>`;
            document.getElementById('auth-link-btn').style.display = 'block';
            document.getElementById('open-auth-link').onclick = () => window.open(msg.url, '_blank');
          } else {
            linkEl.textContent = '';
            document.getElementById('auth-link-btn').style.display = 'none';
          }
        }
      };
    </script>
  </body>
</html>
