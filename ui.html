<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; }
      button { padding: 8px 12px; }
      #status { margin-top: 10px; color: #444; }
    </style>
  </head>
  <body>
    <div id="url-wrap" style="margin-bottom: 8px; display:none;">
      <input id="url" type="text" placeholder="Paste Webflow page URL" style="width: 100%; padding: 6px; box-sizing: border-box;" />
    </div>
    <a id="auth-link" href="https://figma-webflow-sync.onrender.com/auth/start" target="_blank" rel="noopener noreferrer"
       style="display:inline-block; color:#000; text-decoration:underline; font-size:13px;">
      Connect Webflow
    </a>
    <div id="version" style="margin-top:6px; font-size:10px; color:#999;">UI v11</div>
    <button id="sync-btn" style="display:none;">Sync from Webflow</button>
    <div id="status">Ready.</div>

    <script>
      const statusEl = document.getElementById('status');
      const authLink = document.getElementById('auth-link');
      const syncBtn = document.getElementById('sync-btn');
      const urlWrap = document.getElementById('url-wrap');
      let isAuthorized = false;
      let authUrl = '';

      function updatePrimary() {
        if (isAuthorized) {
          authLink.style.display = 'none';
          syncBtn.style.display = 'inline-block';
          urlWrap.style.display = 'block';
        } else {
          syncBtn.style.display = 'none';
          authLink.style.display = 'inline-block';
          urlWrap.style.display = 'none';
          authLink.setAttribute('href', authUrl || 'https://figma-webflow-sync.onrender.com/auth/start');
        }
      }

      authLink.addEventListener('click', () => {
        statusEl.textContent = 'Opening Webflow auth...';
        parent.postMessage({ pluginMessage: { type: 'start-auth' } }, '*');
      });

      syncBtn.onclick = () => {
        const url = document.getElementById('url').value.trim();
        statusEl.textContent = 'Syncing...';
        parent.postMessage({ pluginMessage: { type: 'sync', url } }, '*');
      };

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'status') statusEl.textContent = msg.message;
        if (msg.type === 'auth-status') {
          isAuthorized = !!msg.authorized;
          updatePrimary();
        }
        if (msg.type === 'auth-link') {
          authUrl = msg.url || '';
          authLink.setAttribute('href', authUrl || '#');
          updatePrimary();
        }
      };

      parent.postMessage({ pluginMessage: { type: 'init' } }, '*');
    </script>
  </body>
</html>
