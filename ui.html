<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; }
      button { padding: 8px 12px; }
      #status { margin-top: 10px; color: #444; }
    </style>
  </head>
  <body>
    <div id="url-wrap" style="margin-bottom: 8px; display:none;">
      <input id="url" type="text" placeholder="Paste Webflow page URL" style="width: 100%; padding: 6px; box-sizing: border-box;" />
    </div>
    <a id="auth-link-btn" href="#" target="_blank" rel="noopener noreferrer"
       style="display:inline-block; padding:8px 12px; border:1px solid #333; border-radius:4px; color:#000; text-decoration:none; background:#fff; text-align:center; width: fit-content;">
      Connect Webflow
    </a>
    <button id="sync-btn" style="display:none;">Sync from Webflow</button>
    <div id="status">Ready.</div>

    <script>
      const statusEl = document.getElementById('status');
      const authBtn = document.getElementById('auth-link-btn');
      const syncBtn = document.getElementById('sync-btn');
      const urlWrap = document.getElementById('url-wrap');
      let isAuthorized = false;
      let authUrl = '';

      function updatePrimary() {
        if (isAuthorized) {
          authBtn.style.display = 'none';
          syncBtn.style.display = 'inline-block';
          urlWrap.style.display = 'block';
        } else {
          syncBtn.style.display = 'none';
          authBtn.style.display = 'inline-block';
          urlWrap.style.display = 'none';
          authBtn.setAttribute('href', authUrl || '#');
          authBtn.style.pointerEvents = authUrl ? 'auto' : 'none';
        }
      }

      authBtn.onclick = () => {
        statusEl.textContent = 'Opening Webflow auth...';
        parent.postMessage({ pluginMessage: { type: 'start-auth' } }, '*');
      };

      syncBtn.onclick = () => {
        const url = document.getElementById('url').value.trim();
        statusEl.textContent = 'Syncing...';
        parent.postMessage({ pluginMessage: { type: 'sync', url } }, '*');
      };
      document.getElementById('get-key').onclick = () => {
        statusEl.textContent = 'Select a component or instance...';
        parent.postMessage({ pluginMessage: { type: 'get-key' } }, '*');
      };

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'status') statusEl.textContent = msg.message;
        if (msg.type === 'auth-status') {
          isAuthorized = !!msg.authorized;
          updatePrimary();
        }
        if (msg.type === 'auth-link') {
          authUrl = msg.url || '';
          updatePrimary();
        }
      };

      parent.postMessage({ pluginMessage: { type: 'init' } }, '*');
    </script>
  </body>
</html>
