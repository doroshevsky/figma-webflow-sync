<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 16px; }
      button { padding: 8px 12px; }
      #status { margin-top: 10px; color: #444; }
    </style>
  </head>
  <body>
    <div style="margin-bottom: 8px;">
      <input id="url" type="text" placeholder="Paste Webflow page URL" style="width: 100%; padding: 6px; box-sizing: border-box;" />
    </div>
    <a id="auth-anchor" href="#" target="_blank" rel="noopener noreferrer" style="text-decoration:none;">
      <button id="primary">Connect Webflow</button>
    </a>
    <div id="status">Ready.</div>

    <script>
      const statusEl = document.getElementById('status');
      const primaryBtn = document.getElementById('primary');
      let isAuthorized = false;
      let authUrl = '';

      function updatePrimary() {
        primaryBtn.textContent = isAuthorized ? 'Sync from Webflow' : 'Connect Webflow';
        const anchor = document.getElementById('auth-anchor');
        if (isAuthorized) {
          anchor.setAttribute('href', '#');
          anchor.style.pointerEvents = 'none';
        } else {
          anchor.setAttribute('href', authUrl || '#');
          anchor.style.pointerEvents = authUrl ? 'auto' : 'none';
        }
      }

      primaryBtn.onclick = () => {
        if (!isAuthorized) {
          statusEl.textContent = 'Opening Webflow auth...';
          if (authUrl) {
            parent.postMessage({ pluginMessage: { type: 'start-auth' } }, '*');
          } else {
            parent.postMessage({ pluginMessage: { type: 'connect' } }, '*');
          }
          return;
        }
        const url = document.getElementById('url').value.trim();
        statusEl.textContent = 'Syncing...';
        parent.postMessage({ pluginMessage: { type: 'sync', url } }, '*');
      };
      document.getElementById('get-key').onclick = () => {
        statusEl.textContent = 'Select a component or instance...';
        parent.postMessage({ pluginMessage: { type: 'get-key' } }, '*');
      };

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'status') statusEl.textContent = msg.message;
        if (msg.type === 'auth-status') {
          isAuthorized = !!msg.authorized;
          updatePrimary();
        }
        if (msg.type === 'auth-link') {
          authUrl = msg.url || '';
          updatePrimary();
        }
      };

      parent.postMessage({ pluginMessage: { type: 'init' } }, '*');
    </script>
  </body>
</html>
